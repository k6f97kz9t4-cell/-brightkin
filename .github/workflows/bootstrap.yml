name: Install BrightKin Source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Reconstruct and verify tested BrightKin source
        shell: bash
        run: |
          set -euo pipefail
          if ! compgen -G "bootstrap/part-*" > /dev/null; then
            echo "Bootstrap already completed."
            exit 0
          fi
          cat bootstrap/part-* > /tmp/brightkin.b64
          base64 -d /tmp/brightkin.b64 > /tmp/brightkin.tar.gz
          echo "5f4e228719dba09dc524fa09080cc7f5348e2de5a6a4202f786e7c2f75d78ee9  /tmp/brightkin.tar.gz" | sha256sum -c -
          tar -xzf /tmp/brightkin.tar.gz -C .
          rm -rf bootstrap
          node tests/run-tests.js
          node tests/pages-tests.js
          node --check app.js
          node --check sw.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Install tested BrightKin GitHub build"
          git push
