name: BrightKin CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Behavioral regression suite
        run: node tests/run-tests.js
      - name: Standalone Joy Mission regression suite
        run: node tests/standalone-missions.js
      - name: GitHub Pages compatibility suite
        run: node tests/pages-tests.js
      - name: Syntax checks
        run: node --check app.js && node --check mission-fresh.js && node --check mission-runtime.js && node --check sw.js
