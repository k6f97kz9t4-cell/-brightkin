<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f2ea" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="BrightKin" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <title>BrightKin — More good days together</title>
  <style>
:root{--bg:#f7f2ea;--paper:#fffaf3;--ink:#2f2a27;--muted:#746c65;--line:#e8ded2;--rose:#ed815d;--berry:#7d4965;--sage:#2f6c63;--gold:#e8b85c;--shadow:0 18px 50px rgba(73,55,41,.09);--r:24px}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:radial-gradient(circle at 80% -10%,#ffe1c7 0,transparent 35%),var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}
.shell{max-width:1080px;margin:0 auto;padding:20px 18px 110px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:10px;font-weight:850;letter-spacing:-.03em}.brandmark{width:40px;height:40px;border-radius:15px;background:linear-gradient(135deg,var(--rose),var(--berry));display:grid;place-items:center;color:white;box-shadow:var(--shadow)}.tag{font-size:12px;color:var(--muted)}
.hero{background:linear-gradient(135deg,#fff7ea,#fffdf9);border:1px solid #eee0d0;border-radius:32px;padding:26px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;right:-55px;top:-55px;width:180px;height:180px;border-radius:50%;background:linear-gradient(135deg,#f7c79d,#f09978);opacity:.45}.hero h1{font-size:clamp(34px,7vw,62px);line-height:.95;letter-spacing:-.055em;margin:8px 0 14px;max-width:750px}.hero p{max-width:690px;color:var(--muted);font-size:17px;line-height:1.55}.eyebrow{text-transform:uppercase;font-size:11px;font-weight:850;letter-spacing:.16em;color:var(--sage)}
.grid{display:grid;gap:16px;min-width:0}.grid>*{min-width:0}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.card{min-width:0;overflow-wrap:break-word;background:rgba(255,250,243,.94);border:1px solid var(--line);border-radius:var(--r);padding:19px;box-shadow:0 10px 35px rgba(73,55,41,.05)}.card h2,.card h3{letter-spacing:-.035em;margin:0 0 8px}.muted{color:var(--muted)}.small{font-size:13px}.metric{font-size:38px;font-weight:850;letter-spacing:-.05em}.metriclabel{font-size:12px;color:var(--muted)}
.btn{border:0;border-radius:16px;padding:12px 16px;font-weight:760;background:var(--ink);color:white;transition:.2s transform,.2s opacity}.btn:hover{transform:translateY(-1px)}.btn.secondary{background:#efe6da;color:var(--ink)}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.rose{background:var(--rose)}.btn.sage{background:var(--sage)}.btn.block{width:100%}.btnrow{display:flex;flex-wrap:wrap;gap:9px}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 10px;background:#f2e9dc;color:#5f554d;font-size:12px;font-weight:680}.pill.sage{background:#e1eee9;color:#255d54}.pill.rose{background:#ffe6dc;color:#984f37}.pill.gold{background:#fff0c9;color:#76591f}
.section{margin-top:22px}.sectionhead{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:12px}.sectionhead h2{font-size:28px;letter-spacing:-.045em;margin:0}.sectionhead p{margin:4px 0 0;color:var(--muted)}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,250,243,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20;padding-bottom:env(safe-area-inset-bottom)}.navinner{display:grid;grid-template-columns:repeat(5,1fr);width:min(700px,100%)}.nav button{border:0;background:transparent;padding:11px 5px 10px;color:#756b64;font-size:11px}.nav button.active{color:var(--ink);font-weight:800}.nav .ico{display:block;font-size:19px;margin-bottom:3px}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px}.field label{font-size:12px;font-weight:760;color:#5b524b}.field input,.field select,.field textarea{width:100%;border:1px solid #dfd4c8;border-radius:14px;background:#fffdfa;padding:12px;color:var(--ink);outline:none}.field textarea{min-height:90px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#b88f7c;box-shadow:0 0 0 3px rgba(237,129,93,.12)}
.member{display:flex;align-items:center;gap:11px}.avatar{width:46px;height:46px;border-radius:16px;background:linear-gradient(145deg,#ffd5ba,#ed815d);display:grid;place-items:center;color:white;font-weight:850}.avatar.sage{background:linear-gradient(145deg,#8cc0b4,#2f6c63)}.avatar.berry{background:linear-gradient(145deg,#c994aa,#7d4965)}
.mission{position:relative;overflow:hidden}.mission:before{content:"";position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,var(--rose),var(--gold),var(--sage))}.mission h3{font-size:23px;margin-top:3px}.steps{counter-reset:step;display:grid;gap:8px;margin-top:10px}.step{display:flex;gap:9px;align-items:flex-start}.step:before{counter-increment:step;content:counter(step);width:24px;height:24px;border-radius:50%;background:#efe6da;display:grid;place-items:center;font-size:11px;font-weight:850;flex:0 0 auto}.rating button{border:0;background:transparent;font-size:24px;padding:2px}.timeline{display:grid;gap:13px}.memory{display:grid;grid-template-columns:auto 1fr;gap:13px}.dot{width:14px;height:14px;border-radius:50%;background:var(--rose);margin-top:7px;box-shadow:0 0 0 5px #ffe8de}.artifact{border-left:3px solid #efc189;padding-left:12px;margin-top:10px;min-width:0;max-width:100%;overflow-wrap:break-word}.pre{white-space:pre-wrap;line-height:1.6;color:#514942;max-width:100%;overflow-wrap:anywhere;word-break:normal}
.graph{position:relative;min-height:350px;border-radius:26px;background:radial-gradient(circle at center,#fff 0,#fbf4e9 58%,#f0e5d7 100%);border:1px solid var(--line);overflow:hidden}.node{position:absolute;transform:translate(-50%,-50%);width:88px;height:88px;border-radius:50%;display:grid;place-items:center;text-align:center;padding:7px;font-weight:850;color:white;box-shadow:0 14px 35px rgba(69,48,36,.18);z-index:2}.edge{position:absolute;height:2px;background:#cdbba8;transform-origin:0 50%;z-index:1}.graphlegend{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#2f2a27;color:white;padding:11px 15px;border-radius:999px;z-index:60;box-shadow:var(--shadow);animation:pop .25s ease}.celebrate{position:fixed;inset:0;pointer-events:none;z-index:50;background:radial-gradient(circle at center,rgba(255,255,255,0) 0 30%,rgba(237,129,93,.09));animation:fade 1.1s ease forwards}@keyframes pop{from{transform:translate(-50%,-10px);opacity:0}}@keyframes fade{to{opacity:0}}
.empty{padding:28px;text-align:center;border:1px dashed #d9ccbe;border-radius:20px;color:var(--muted)}.price{font-size:36px;font-weight:850;letter-spacing:-.05em}.featured{outline:2px solid var(--rose);position:relative}.featured:after{content:"Best value";position:absolute;right:14px;top:14px;background:var(--rose);color:white;font-size:10px;font-weight:850;border-radius:999px;padding:5px 8px}
.modalwrap{position:fixed;inset:0;background:rgba(44,34,28,.38);backdrop-filter:blur(8px);z-index:40;display:grid;place-items:end center}.modal{background:var(--paper);width:min(700px,100%);max-height:88vh;overflow:auto;border-radius:30px 30px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -15px 60px rgba(0,0,0,.15)}.close{float:right;border:0;background:#efe6da;width:36px;height:36px;border-radius:50%}
.kpirow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{padding:14px;border-radius:18px;background:#f4ecdf}.kpi b{display:block;font-size:24px}.progress{height:10px;border-radius:999px;background:#eadfd3;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--gold))}.install{background:#203d38;color:#f9f4ed}.install .muted{color:#d8e4df}
.mediaGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}.mediaSlot{background:#f0e7db;border-radius:16px;min-height:110px;overflow:hidden;display:grid;place-items:center}.mediaSlot img,.mediaSlot video{display:block;width:100%;height:100%;max-height:320px;object-fit:cover}.toggle{display:flex;align-items:center;gap:10px;font-weight:750}.toggle input{width:20px;height:20px}.bookCover{background:linear-gradient(145deg,#2f2a27,#59453a);color:#fff;border-radius:32px;padding:42px 28px;min-height:360px;display:flex;flex-direction:column;justify-content:flex-end}.bookCover h1{font-size:clamp(54px,11vw,92px);line-height:.88;letter-spacing:-.06em;margin:10px 0}.bookCover .eyebrow{color:#f3c899}.bookPages{display:grid;gap:16px}.bookPage{break-inside:avoid}.field.compact{min-width:110px}.btn:disabled{opacity:.55;cursor:wait;transform:none}.noPrint{}@media print{body{background:#fff}.nav,.topbar,.noPrint,.toast{display:none!important}.shell{max-width:none;padding:0}.card,.hero,.bookCover{box-shadow:none}.bookCover{break-after:page}.bookPage{break-inside:avoid}.mediaSlot{max-height:360px}.section{break-inside:avoid}}@media (max-width:760px){.shell{padding:14px 13px 100px}.g2,.g3,.formgrid{grid-template-columns:1fr}.mediaGrid{grid-template-columns:1fr}.hero{padding:22px 18px}.hero h1{font-size:43px}.kpirow{grid-template-columns:repeat(2,1fr)}.topbar .tag{display:none}.sectionhead h2{font-size:25px}.graph{min-height:420px}}

</style>
</head>
<body>
  <div id="app"></div>
  <script src="./app.js"></script>
</body>
</html>
